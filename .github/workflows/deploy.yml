name: Publish FreePublish to GitHub Pages

# Optional standalone Pages deployment; production lives in AIPMAndy.github.io/FreePublish
on:
  workflow_dispatch:

concurrency:
  group: freepublish-github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and run unit tests
        run: |
          node --check src/core.mjs
          node --check src/app.mjs
          node --check src/media.mjs
          node --check src/zip.mjs
          node --check src/calendar.mjs
          node --test tests/*.test.mjs
      - name: Validate production files
        run: |
          test -s index.html
          test -s icon.svg
          test -s manifest.webmanifest
          test -s sw.js
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare exact static site bundle
        run: |
          mkdir -p _site/src
          cp index.html icon.svg manifest.webmanifest sw.js _site/
          cp src/*.mjs src/styles.css _site/src/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
